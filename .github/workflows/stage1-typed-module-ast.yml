name: Stage 1 typed module AST

on:
  push:
    branches: [stage1-typed-module-ast]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  stage1-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Create an exact-revision scratch clone
        env:
          REPOSITORY: ${{ github.repository }}
          TARGET_REF: ${{ github.head_ref || github.ref_name }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git clone --no-checkout --branch "${TARGET_REF}" \
            "https://github.com/${REPOSITORY}.git" "${RUNNER_TEMP}/suru-stage1-scratch"
          git -C "${RUNNER_TEMP}/suru-stage1-scratch" fetch --no-tags origin "${TARGET_SHA}"
          git -C "${RUNNER_TEMP}/suru-stage1-scratch" checkout --detach "${TARGET_SHA}"
          cd "${RUNNER_TEMP}/suru-stage1-scratch"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test -s selfhost/compiler/natural_bytecode.suru
          test -s tests/selfhost/natural_build_driver.suru
          test -s tests/selfhost/natural_cli_selfhost_run.sh

      - name: Normal, self-hosted compiler, and determinism gates
        working-directory: ${{ runner.temp }}/suru-stage1-scratch
        run: |
          make clean
          make test
          make determinism-test

      - name: Incremental and interval-one GC
        working-directory: ${{ runner.temp }}/suru-stage1-scratch
        env:
          SURU_GC_INCREMENTAL: "1"
        run: make integration

      - name: Static analysis
        working-directory: ${{ runner.temp }}/suru-stage1-scratch
        run: make analyze

      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        working-directory: ${{ runner.temp }}/suru-stage1-scratch
        run: make BUILD=build-asan asan-test

      - name: Clang cross-compiler
        working-directory: ${{ runner.temp }}/suru-stage1-scratch
        run: make CC=clang BUILD=build-clang test

      - name: Final scratch worktree
        working-directory: ${{ runner.temp }}/suru-stage1-scratch
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
